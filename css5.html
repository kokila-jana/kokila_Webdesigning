<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a
        {
            width: 100vw;
            height: 100vh;
            border: 5px solid;
            display: flex;
            gap: 10px;
        }
        .x,.y,.z
        {
            width: 500px;
            height: 580px;

        }
        .x
        {
            background-image: url(10008.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .y
        {
            background-image: url(10009.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .z
        {
            background-image: url(10010.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        @media screen and (min-width:576px) and (max-width:768px)
        {
            .a
            {
                display: grid;
                grid-template-columns: auto;
                border: none;
            }
        }
    </style>
</head>
<body>
    <div class="a">
        <div class="x"></div>
        <div class="y"></div>
        <div class="z"></div>
    </div>
</body>
</html>
