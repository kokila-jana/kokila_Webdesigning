<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear
        {
            width: 100vw;
            height: 100vh;
            border: 2px solid;
           background-image: linear-gradient(240deg,orange,white,green);
        }
        .radial
        {
             width: 100vw;
            height: 100vh;
            border: 2px solid;
            background-image: radial-gradient(red,30%, violet,blue,50%,black);
        }
        .conic
        { width: 100vw;
            height: 100vh;
            border: 2px solid;
            background-image: conic-gradient(20%,yellow,green,brown)
        }
    </style>
</head>
<body>
    <div class="linear">
        <h1>Hello</h1>
    </div>
    <div class="radial"></div>
    <div class="conic"></div>
</body>
</html>
