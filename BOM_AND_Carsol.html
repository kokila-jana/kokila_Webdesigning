<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="" alt="" width="200px" height="200px">
    <script>
        image=['10008.jpg','10009.jpg','10010.jpg','10011.jpg','10012.jpg','10013.jpg']
        let z=0
        document.querySelector("img").src=image[z]

        function nxt()
        {
            z++
            if(z>=image.length)
            {
                z=0
            }
        document.querySelector("img").src=image[z]
        }
        setInterval(nxt,2000)

         function prev()
        {
            z--
            if(z<0)
            {
                z=image.length-1
            }
        document.querySelector("img").src=image[z]

        }
    </script>
</body>
</html>
